<!DOCTYPE html>
<html><head><title>A Form</title></head>
<body>
<h1>Look Something Up</h1>
<form action="RESULT.HTM" method="get"><input type="hidden" name="src" value="glos">
<input type="text" name="q" placeholder="Words"> <select name="in"><option value="all">Everything
<option value="pics" selected>Pictures</select> <input type="checkbox" name="safe" checked>
<input type="radio" name="size" value="s"> <input type="radio" name="size" value="l" checked>
<input type="submit" value="Look"></form>
<p>A second form, sent another way:</p>
<form action="RESULT.HTM" method="post"><input name="x"> <input type="submit" value="Post it"></form>
</body></html>
