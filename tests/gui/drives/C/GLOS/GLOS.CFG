; GLOS.CFG for the Control Panel's pages (tests/gui/control.txt): on the host (tests/host/glosshim.c reads it)
; and in Loop A (the native suite copies it beside GLOS.EXE).
[display]
gpu_watchdog = 750

[input]
repeat_rate = 15

[program FWHEEL.EXE]
title = Fifth Wheel
icon = game
menu = 1
memory = 16384
env = FW=1
env = PATH=C:\FW;C:\DOS

[program DOOM.EXE]
screen = full

[open]
.TXT = NOTEPAD.EXE
.PNG = IMAGES.EXE
